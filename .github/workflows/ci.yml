name: CI/CD Frontend

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: jlh-autopam-frontend
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend image (latest + sha)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-production:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy frontend on Hostinger
        shell: bash
        run: |
          set -euo pipefail

          test -f "${{ env.COMPOSE_FILE }}"

          # Déploie exactement l'image taggée avec le SHA du commit
          export FRONTEND_TAG="${GITHUB_SHA}"

          echo "Using FRONTEND_TAG=${FRONTEND_TAG}"
          docker compose -f "${{ env.COMPOSE_FILE }}" config | sed -n '1,160p'

          docker compose -f "${{ env.COMPOSE_FILE }}" pull
          docker compose -f "${{ env.COMPOSE_FILE }}" up -d --force-recreate

          docker image prune -f
