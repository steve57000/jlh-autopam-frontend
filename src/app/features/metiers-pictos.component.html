<section class="section-pictos-metiers" appInViewport>
  <div class="container-max">
    <h2 class="section-title" appInViewport>Nos services & expertises</h2>
    <p class="section-subtitle" appInViewport>
      Pneumatiques, entretien et réparation automobile à Pont‑à‑Mousson : découvrez nos prestations.
    </p>
    <div class="pictos-wrapper" appInViewport>
      @for (item of items; track $index) {
        <div class="picto-bloc">
          <button
            type="button"
            class="picto-button"
            (click)="openModal(item, $event)"
            [attr.aria-label]="'En savoir plus sur ' + item.label"
            aria-haspopup="dialog"
          >
            <img
              [src]="item.img"
              [alt]="item.label"
              class="picto-img"
              width="150"
              height="150"
              loading="lazy"
            />
            <div class="picto-label">{{ item.label }}</div>
          </button>
        </div>
      }
    </div>
    <div class="services-cta" appInViewport>
      <a class="cta-btn" routerLink="/services">Découvrir tous nos services</a>
    </div>
  </div>
  @if (selectedItem; as active) {
    <div class="service-modal" [class.is-closing]="isClosing">
      <div class="service-modal__backdrop" (click)="closeModal()" aria-hidden="true"></div>
      <div
        #dialogElement
        class="service-modal__dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="service-modal-title"
        aria-describedby="service-modal-description"
        tabindex="-1"
      >
        <button
          type="button"
          class="service-modal__close"
          (click)="closeModal()"
          aria-label="Fermer la fenêtre"
        >
          ×
        </button>
        <img
          [src]="active.img"
          [alt]="active.label"
          width="150"
          height="150"
          class="service-modal__icon"
          loading="lazy"
        />
        <h3 id="service-modal-title" class="service-modal__title">{{ active.label }}</h3>
        <p id="service-modal-description" class="service-modal__description">{{ active.description }}</p>
        <a class="cta-btn service-modal__cta" routerLink="/services">Voir tous nos services</a>
      </div>
    </div>
  }
</section>
