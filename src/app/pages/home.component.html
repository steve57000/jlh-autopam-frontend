<div class="container-main">
  <!-- Section promotions -->
  <app-promotions-slider class="app-promotions-slider" [promotions]="promotions"></app-promotions-slider>

  <!-- Section intro -->
  <app-intro-accueil></app-intro-accueil>

  <!-- Section services -->
  <app-metiers-pictos [items]="metiersPictos"></app-metiers-pictos>

  <!-- Section carrousel / agréments -->
  <div #sectionAgrements>
    <app-section-caroussel
      [title]="'Nos agréments'"
      [subtitle]="'Nos labels et certifications pour une qualité de service irréprochable.'"
      [background]="'gradient'"
      [cards]="agrementsCards"
      [activeIndex]="activeIndexAgrements">
    </app-section-caroussel>
  </div>

  <!-- Section marques -->
  <app-brands></app-brands>
</div>
