<header class="header">
  <div class="container-max">
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <img ngSrc="assets/logo/jlh-logo.svg" alt="JLH Auto Pam" height="69" width="300" priority />
    </a>

    <button
      class="burger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-label="Ouvrir / fermer le menu"
    >
      <span [class.open]="menuOpen"></span>
      <span [class.open]="menuOpen"></span>
      <span [class.open]="menuOpen"></span>
    </button>

    <nav [class.open]="menuOpen">
      <!-- liens publics -->
      <a routerLink="/"       routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Accueil</a>
      <a routerLink="/services" routerLinkActive="active" (click)="closeMenu()">Services</a>
      <a routerLink="/devis"     routerLinkActive="active" (click)="closeMenu()">Demande de devis</a>
      <a routerLink="/contact"   routerLinkActive="active" (click)="closeMenu()">Contact</a>

      <!-- si connecté : Dashboard + Déconnexion -->
      @if (loggedIn) {
        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          (click)="closeMenu()"
        >Dashboard</a>
        <button class="cta-btn" (click)="logout()">Déconnexion</button>
      }
      @else {
        <!-- sinon : Se connecter / S'inscrire -->
        <a
          routerLink="/login"
          routerLinkActive="active"
          (click)="closeMenu()"
        >Se connecter</a>
        <a
          routerLink="/register"
          routerLinkActive="active"
          (click)="closeMenu()"
        >S’inscrire</a>
      }
    </nav>
  </div>
</header>
