<header class="header" [class.menu-open]="menuOpen">
  <div class="container-max">
    <a routerLink="/" class="logo" (click)="closeMenu()" aria-label="Retour à l’accueil">
      <img ngSrc="assets/logo/jlh-logo.svg" alt="JLH Auto Pam" height="69" width="300" priority />
    </a>

    <button
      class="burger"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMobileMenu ? (menuOpen ? 'true' : 'false') : null"
      [attr.aria-hidden]="isMobileMenu ? null : 'true'"
      [attr.tabindex]="isMobileMenu ? '0' : '-1'"
      [attr.aria-controls]="'primary-navigation'"
      aria-label="Ouvrir / fermer le menu"
    >
      <span [class.open]="menuOpen"></span>
      <span [class.open]="menuOpen"></span>
      <span [class.open]="menuOpen"></span>
    </button>

    <nav
      id="primary-navigation"
      [class.open]="menuOpen"
      [attr.aria-hidden]="isMobileMenu ? (menuOpen ? 'false' : 'true') : 'false'"
      [attr.inert]="isMobileMenu && !menuOpen ? '' : null"
      aria-label="Navigation principale"
    >
      <!-- liens publics -->
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu(); closeGroups()">Accueil</a>
      <details class="nav-group" #catalogueGroup [attr.open]="catalogueOpen ? '' : null">
        <summary (click)="toggleGroup('catalogue', $event)" [attr.aria-expanded]="catalogueOpen">
          Catalogue
          <span class="nav-group__chevron" aria-hidden="true"></span>
        </summary>
        <div class="nav-group__menu">
          <a
            routerLink="/services"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu(); closeGroups()"
          >Catalogue des prestations</a>
          <a routerLink="/services/entretien" routerLinkActive="active" (click)="closeMenu(); closeGroups()">Entretien &amp; révision</a>
          <a routerLink="/services/mecanique" routerLinkActive="active" (click)="closeMenu(); closeGroups()">Mécanique générale</a>
          <a routerLink="/services/pneumatiques" routerLinkActive="active" (click)="closeMenu(); closeGroups()">Pneumatiques &amp; géométrie</a>
          <a routerLink="/services/diagnostic" routerLinkActive="active" (click)="closeMenu(); closeGroups()">Diagnostic électronique</a>
        </div>
      </details>
      <details class="nav-group" #aboutGroup [attr.open]="aboutOpen ? '' : null">
        <summary (click)="toggleGroup('about', $event)" [attr.aria-expanded]="aboutOpen">
          À propos
          <span class="nav-group__chevron" aria-hidden="true"></span>
        </summary>
        <div class="nav-group__menu">
          <a routerLink="/about" routerLinkActive="active" (click)="closeMenu(); closeGroups()">Qui sommes-nous ?</a>
          <a routerLink="/team" routerLinkActive="active" (click)="closeMenu(); closeGroups()">Notre équipe</a>
          <a routerLink="/history" routerLinkActive="active" (click)="closeMenu(); closeGroups()">Historique du garage</a>
          <a routerLink="/values" routerLinkActive="active" (click)="closeMenu(); closeGroups()">Valeurs &amp; engagements</a>
        </div>
      </details>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a>

      <!-- si connecté : Dashboard + Déconnexion -->
      @if (loggedIn) {
        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          (click)="closeMenu()"
        >Dashboard</a>
        <button class="cta-btn" (click)="logout()">Déconnexion</button>
      }
      @else {
        <!-- sinon : Se connecter / S'inscrire -->
        <a
          routerLink="/login"
          routerLinkActive="active"
          (click)="closeMenu()"
        >Se connecter</a>
        <a
          routerLink="/register"
          routerLinkActive="active"
          (click)="closeMenu()"
        >S’inscrire</a>
      }
    </nav>
  </div>
</header>
