<div class="container-max">
  <div class="card">
    <h2>Réinitialisation du mot de passe</h2>

    @if (!token) {
      <p>Entrez votre e-mail. Si un compte existe, vous recevrez un lien.</p>
      <form [formGroup]="emailForm" (ngSubmit)="submitEmail()">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
        <button type="submit" [disabled]="loading">Envoyer le lien</button>
      </form>
    } @else {
      <p>Définissez votre nouveau mot de passe.</p>
      <form [formGroup]="passwordForm" (ngSubmit)="submitNewPassword()">
        <label>Nouveau mot de passe</label>
        <input type="password" formControlName="newPassword" autocomplete="new-password" />
        <label>Confirmer</label>
        <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
        @if (matchError()) { <div class="error">{{ matchError() }}</div> }
        <button type="submit" [disabled]="loading">Réinitialiser</button>
      </form>
    }

    @if (message()) { <div class="notice success">{{ message() }}</div> }
    @if (error())   { <div class="notice error">{{ error() }}</div> }
  </div>

</div>
