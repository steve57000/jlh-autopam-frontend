<section class="brands-section" aria-labelledby="brands-title">
  <div class="container-max">
    <h2 id="brands-title" class="title">Nos marques</h2>
    <p class="subtitle">
      Des partenaires reconnus pour la qualité de vos pneus et équipements automobiles.
    </p>

    <div class="rail-wrap">
      <!-- Chevrons conditionnels (petits écrans) -->
      <button
        class="chevron chevron--left"
        type="button"
        aria-label="Défiler vers la gauche"
        (click)="scroll('left')"
        *ngIf="canScrollLeft"
      >
        ‹
      </button>

      <div #rail class="rail" [@listStagger]>
        <article
          class="brand-item"
          *ngFor="let brand of brands; trackBy: trackByName"
          [attr.aria-label]="brand.name"
        >
          <img
            [ngSrc]="brand.src"
            [attr.srcset]="brand.srcset ?? null"
            [alt]="brand.alt || brand.name"
            [attr.sizes]="brand.sizes || null"
            [width]="brand.width ?? 300"
            [height]="brand.height ?? 168"
            loading="lazy"
            decoding="async"
          />
          <span class="sr-only">{{ brand.name }}</span>
        </article>
      </div>

      <button
        class="chevron chevron--right"
        type="button"
        aria-label="Défiler vers la droite"
        (click)="scroll('right')"
        *ngIf="canScrollRight"
      >
        ›
      </button>
    </div>
  </div>
</section>
